<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Saya</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background: #f4f4f4;
        }
        header {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 20px;
        }
        .post {
            background: #fff;
            margin-bottom: 2rem;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .post h2 {
            color: #333;
            margin-bottom: 0.5rem;
        }
        .post-date {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        .post p {
            color: #444;
        }
    </style>
</head>
<body>
    <header>
        <h1>Blog Saya</h1>
        <p>Catatan dan tulisan random</p>
    </header>

    <div class="container" id="posts">
        <!-- Posts akan muncul di sini -->
    </div>

    <script>
        // Array untuk menyimpan post-post blog
        const posts = [
            {
                title: "Post Pertama",
                date: "4 Februari 2025",
                content: "Ini adalah post pertama di blog saya. Mulai sekarang saya akan rajin nulis di sini!"
            },
            {
                title: "Belajar GitHub Pages",
                date: "4 Februari 2025",
                content: "Ternyata mudah banget bikin blog pakai GitHub Pages. Gratis lagi!"
            }
        ];

        // Render posts
        const postsContainer = document.getElementById('posts');
        posts.forEach(post => {
            const postHTML = `
                <div class="post">
                    <h2>${post.title}</h2>
                    <div class="post-date">${post.date}</div>
                    <p>${post.content}</p>
                </div>
            `;
            postsContainer.innerHTML += postHTML;
        });
    </script>
</body>
</html>
